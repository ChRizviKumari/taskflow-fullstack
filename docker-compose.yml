services:
  backend:
    build: ./backend
    environment:
      # Set a real secret: TASKFLOW_SECRET=$(openssl rand -hex 32) docker compose up
      TASKFLOW_SECRET: ${TASKFLOW_SECRET:?set TASKFLOW_SECRET}
      TASKFLOW_DB: /data/taskflow.db
      TASKFLOW_CORS_ORIGIN: http://localhost:8080
    volumes:
      - taskflow-data:/data
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  taskflow-data:
